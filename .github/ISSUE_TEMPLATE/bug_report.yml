name: Bug report
description: Report a reproducible Community issue
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include cloud credentials, local API tokens, or unredacted customer data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "3.0.0 / commit sha"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app
        - Local API
        - Export / handoff
        - Skills
        - Documentation
        - Build / packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest reproducible steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Rust, Node, Tauri, browser if relevant"
