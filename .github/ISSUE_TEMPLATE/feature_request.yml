name: Feature request
description: Suggest a Community-scope improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope fit
      options:
        - Community local-first
        - Skills
        - Documentation
        - Unsure
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Mention if this requires Team or Enterprise workflow coordination.
