name: Release Community App

on:
  workflow_dispatch: # Manual trigger only (Save Quota)
    inputs:
      tag_name:
        description: "Release tag to attach macOS artifacts to, for example v3.1.1. Leave empty to build workflow artifacts only."
        required: false
        type: string
      upload_release:
        description: "Upload macOS DMG to the GitHub Release for tag_name."
        required: false
        type: boolean
        default: true
  # push:
  #   tags:
  #     - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: install frontend dependencies
        working-directory: ./gui
        run: npm ci --no-audit --no-fund

      - name: Build macOS Tauri App
        working-directory: ./gui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run tauri build -- --ci --target universal-apple-darwin --bundles dmg

      - name: Collect macOS Bundle Artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail

          out_dir="_bundle_upload"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"

          found=0
          found_dmg=0

          copy_file_matches() {
            local pattern="$1"
            while IFS= read -r -d '' f; do
              found=1
              if [[ "$f" == *.dmg ]]; then
                found_dmg=1
              fi
              local base
              base="$(basename "$f")"
              local safe
              safe="$(echo "$f" | sed 's#^\./##' | tr '/' '__')"
              cp "$f" "$out_dir/$safe"
              echo "collected: $f"
            done < <(find . -type f -name "$pattern" -print0)
          }

          copy_dir_matches() {
            local pattern="$1"
            while IFS= read -r -d '' d; do
              found=1
              local safe
              safe="$(echo "$d" | sed 's#^\./##' | tr '/' '__')"
              cp -R "$d" "$out_dir/$safe"
              echo "collected: $d"
            done < <(find . -type d -name "$pattern" -print0)
          }

          copy_file_matches "*.dmg"
          copy_file_matches "*.app.tar.gz"
          copy_dir_matches "*.app"

          if [ "$found" -eq 0 ]; then
            echo "::error::No macOS bundle artifacts found"
            echo "Bundle directories discovered:"
            find . -type d -name bundle | sed 's#^\./##' || true
            exit 1
          fi

          if [ "$found_dmg" -eq 0 ]; then
            echo "::error::macOS build completed but no .dmg artifact was produced"
            echo "Bundle files discovered:"
            find . -type f \( -name "*.dmg" -o -name "*.app" -o -name "*.app.tar.gz" \) | sed 's#^\./##' || true
            exit 1
          fi

          echo "bundle_dir=$out_dir" >> "$GITHUB_OUTPUT"

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundles-macos
          if-no-files-found: error
          path: ${{ steps.collect.outputs.bundle_dir }}/**

      - name: Resolve Release Notes
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag_name }}" ]; then
            tag="${{ inputs.tag_name }}"
          fi
          notes_path=".github/release-notes/${tag}.md"
          if [ ! -f "$notes_path" ]; then
            echo "::error::Missing release notes file: $notes_path"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "path=$notes_path" >> "$GITHUB_OUTPUT"
          echo "Using release notes: $notes_path"

      - name: Upload Artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.upload_release == true && inputs.tag_name != '')
        with:
          tag_name: ${{ steps.release_notes.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.path }}
          files: ${{ steps.collect.outputs.bundle_dir }}/*
