  <path d="M1030 142 C1180 128 1276 198 1334 332 C1392 466 1510 470 1570 424 L1600 900 L1018 900 C930 710 888 532 912 366 C930 244 962 166 1030 142Z" fill="#f8fafc" opacity="0.16"/>

