log_format cws_analytics escape=json
    '{"ts":$msec,"ip":"$remote_addr","host":"$host",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"ref":"$http_referer","ua":"$http_user_agent"}';

server {
    listen 80;
    listen [::]:80;
    server_name cloud-waste-scanner.com www.cloud-waste-scanner.com;

    access_log /var/log/nginx/cloud-waste-scanner.access.log cws_analytics;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cloud-waste-scanner.com www.cloud-waste-scanner.com;

    ssl_certificate /etc/letsencrypt/live/cloud-waste-scanner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud-waste-scanner.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/cloud-waste-scanner.access.log cws_analytics;
    root /var/www/cloud-waste-scanner;
    index index.html;
    error_page 403 /error.html;
    error_page 404 /404.html;

    location = /error.html { internal; }
    location = /404.html { internal; }
    location = /admin { return 301 /admin/; }
    location = /admin.html { return 301 /admin/; }
    location = /solutions { try_files /solutions.html =404; }
    location = /solutions/ { try_files /solutions.html =404; }
    location = /api { try_files /api.html =404; }

    location /api/ {
        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /blog {
        try_files /blog.html =404;
    }

    location = /blog/ {
        try_files /blog.html =404;
    }

    location /archive/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }
}
