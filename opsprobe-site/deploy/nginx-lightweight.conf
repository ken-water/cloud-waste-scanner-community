server {
    listen 80;
    listen [::]:80;
    server_name cloud-waste-scanner.com www.cloud-waste-scanner.com;

    root /var/www/cloud-waste-scanner;
    index index.html;
    error_page 403 /error.html;
    error_page 404 /error.html;
    error_page 404 /error.html;

    location = /error.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /archive/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name download.cloud-waste-scanner.com dl.cloud-waste-scanner.com;

    root /var/www/cloud-waste-scanner;
    index index.html;
    error_page 403 /error.html;
    error_page 404 /error.html;
    error_page 404 /error.html;

    location = /error.html {
        internal;
    }

    location = /api/download/latest {
        return 302 https://cloud-waste-scanner.com/download/;
    }

    location /downloads/ {
        rewrite ^/downloads/(.*)$ /download/files/$1 permanent;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.cloud-waste-scanner.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.cloud-waste-scanner.com;

    ssl_certificate /etc/letsencrypt/live/cloud-waste-scanner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud-waste-scanner.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/cloud-waste-scanner;
    index index.html;
    error_page 403 /error.html;
    error_page 404 /error.html;

    location = /error.html {
        internal;
    }

    location = /admin { return 301 /admin/; }

    location /api/ {
        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.cloud-waste-scanner.com;

    location / {
        error_page 403 /error.html;
        error_page 404 /error.html;
        return 302 https://cloud-waste-scanner.com/api.html;
    }
}
