<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover License - Cloud Waste Scanner</title>
    <meta name="description" content="Recover a Cloud Waste Scanner license key using the email associated with the original purchase account.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="logo.png">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-700 h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Lost your key?</h1>
            <p class="text-slate-500 mt-2">Enter the email associated with your <strong>PayPal account</strong>.</p>
        </div>

        <form id="recoverForm" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">PayPal Email Address</label>
                <input type="email" id="email" required placeholder="john@example.com" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>
            <button type="submit" id="submitBtn" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-500/30 disabled:opacity-50">
                Resend My Key
            </button>
        </form>

        <div id="message" class="mt-6 text-center text-sm font-medium hidden"></div>

        <div class="mt-8 text-center">
            <a href="index.html" class="text-slate-400 hover:text-indigo-600 transition-colors text-sm">← Back to Homepage</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('recoverForm');
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('message');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            btn.disabled = true;
            btn.innerText = 'Processing...';

            try {
                const res = await fetch('/api/recover-license', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                msg.classList.remove('hidden');
                msg.classList.add('text-green-600');
                msg.innerText = 'If an account exists, your key has been sent to your inbox.';
                form.reset();
            } catch (err) {
                msg.classList.remove('hidden');
                msg.classList.add('text-red-600');
                msg.innerText = 'Something went wrong. Please contact support.';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Resend My Key';
            }
        };
    </script>
</body>
</html>
