<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="t d">
<title id="t">Part 1 · Threat Actors and Control Surfaces</title>
<desc id="d">Threat classes mapped to primary controls and residual actions.</desc>
