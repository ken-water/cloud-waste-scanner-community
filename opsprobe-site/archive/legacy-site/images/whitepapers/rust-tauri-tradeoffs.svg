<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="t d">
<title id="t">Runtime Stack Decisions: Rust Core + Tauri Desktop</title>
<desc id="d">Benefits, costs, and operating implications.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fbff"/>
    <stop offset="100%" stop-color="#eef3ff"/>
  </linearGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0a66c2"/>
    <stop offset="100%" stop-color="#3b82f6"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
  <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0,0 8,3 0,6" fill="#1d4ed8"/>
  </marker>
</defs>
<rect width="1800" height="980" fill="url(#bg)"/>
<rect x="40" y="40" width="1720" height="900" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
<rect x="70" y="64" width="1660" height="84" rx="18" fill="url(#titleGrad)"/>
<text x="96" y="118" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff">Runtime Stack Decisions: Rust Core + Tauri Desktop</text>
<g filter="url(#softShadow)"><rect x="100" y="220" width="800" height="300" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/></g>
<rect x="100" y="220" width="8" height="300" rx="8" fill="#2563eb"/>
<foreignObject x="124" y="238" width="760" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#0f172a;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">Why Rust for Core Engine</div></foreignObject>
<foreignObject x="124" y="292" width="760" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#334155;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">• Strong memory-safety model and predictable runtime behavior<br/>• High-performance parallel execution for scan workloads<br/>• Deterministic data processing for audit-friendly outputs<br/>• Good fit for provider adapter and normalization pipelines</div></foreignObject>
<g filter="url(#softShadow)"><rect x="940" y="220" width="760" height="300" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/></g>
<rect x="940" y="220" width="8" height="300" rx="8" fill="#0ea5e9"/>
<foreignObject x="964" y="238" width="720" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#0f172a;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">Why Tauri for Desktop</div></foreignObject>
<foreignObject x="964" y="292" width="720" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#334155;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">• Local-first desktop deployment with controlled update path<br/>• Native bridge for local API and file-export workflows<br/>• Lightweight packaging compared with heavier desktop shells<br/>• Fits operator-owned runtime and credential-custody model</div></foreignObject>
<g filter="url(#softShadow)"><rect x="100" y="560" width="1600" height="300" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/></g>
<rect x="100" y="560" width="8" height="300" rx="8" fill="#1d4ed8"/>
<foreignObject x="124" y="578" width="1560" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#0f172a;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">Tradeoffs to Acknowledge (No Marketing Spin)</div></foreignObject>
<foreignObject x="124" y="632" width="1560" height="216"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#334155;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">• Desktop local-first means endpoint hygiene remains customer responsibility.<br/>• Multi-provider API variance requires sustained adapter maintenance.<br/>• Some checks depend on provider telemetry and granted scope.<br/>• QA governance continues to improve with explicit release evidence.<br/>Decision model: strong control and transparency with disciplined operations.</div></foreignObject>
</svg>