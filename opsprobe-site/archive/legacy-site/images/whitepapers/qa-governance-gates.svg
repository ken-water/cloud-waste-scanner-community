    <stop offset="0%" stop-color="#0a66c2"/>
    <stop offset="100%" stop-color="#3b82f6"/>
  </linearGradient>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
  <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0,0 8,3 0,6" fill="#1d4ed8"/>
  </marker>
</defs>
<rect width="1800" height="1040" fill="url(#bg)"/>
<rect x="40" y="40" width="1720" height="960" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
