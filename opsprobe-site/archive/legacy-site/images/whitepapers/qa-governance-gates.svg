<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="t d">
<title id="t">QA Governance and Release Gate Pipeline</title>
<desc id="d">Engineering quality controls from recent release waves.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
