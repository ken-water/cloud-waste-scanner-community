<foreignObject x="414" y="292" width="200" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#334155;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">Fault Injection</div></foreignObject>
<g filter="url(#softShadow)"><rect x="680" y="220" width="240" height="150" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/></g>
<rect x="680" y="220" width="8" height="150" rx="8" fill="#14b8a6"/>
<foreignObject x="704" y="238" width="200" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#0f172a;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">Gate 3</div></foreignObject>
<foreignObject x="704" y="292" width="200" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#334155;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">Perf Guard</div></foreignObject>
<g filter="url(#softShadow)"><rect x="970" y="220" width="240" height="150" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/></g>
<rect x="970" y="220" width="8" height="150" rx="8" fill="#6366f1"/>
<foreignObject x="994" y="238" width="200" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#0f172a;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">Gate 4</div></foreignObject>
<foreignObject x="994" y="292" width="200" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#334155;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">Coverage Risk</div></foreignObject>
<g filter="url(#softShadow)"><rect x="1260" y="220" width="440" height="150" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2"/></g>
<rect x="1260" y="220" width="8" height="150" rx="8" fill="#60a5fa"/>
<foreignObject x="1284" y="238" width="400" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#93c5fd;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">Gate 5</div></foreignObject>
<foreignObject x="1284" y="292" width="400" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#dbeafe;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">Release Closeout Evidence</div></foreignObject>
<g filter="url(#softShadow)"><rect x="100" y="430" width="760" height="500" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/></g>
<rect x="100" y="430" width="8" height="500" rx="8" fill="#1d4ed8"/>
<foreignObject x="124" y="448" width="720" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#0f172a;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">What Is Enforced</div></foreignObject>
<foreignObject x="124" y="502" width="720" height="416"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#334155;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">• Secret-pattern checks and security-config regression checks<br/>• Resilience negative-path tests and recovery drills<br/>• Performance baseline and regression guard<br/>• Changed-file coverage and uncovered-budget policy<br/>• QA artifact index and phase closeout reports</div></foreignObject>
<g filter="url(#softShadow)"><rect x="920" y="430" width="780" height="500" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/></g>
<rect x="920" y="430" width="8" height="500" rx="8" fill="#0284c7"/>
<foreignObject x="944" y="448" width="740" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#0f172a;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">Why It Matters</div></foreignObject>
<foreignObject x="944" y="502" width="740" height="416"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#334155;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">• Release lines carry auditable proof, not narrative-only claims<br/>• Security/reliability regressions are caught before rollout<br/>• Coverage governance keeps risk visible while moving to 95%<br/>• Engineering, security, and product share one decision package<br/>• Enterprise due diligence becomes faster and cleaner</div></foreignObject>
