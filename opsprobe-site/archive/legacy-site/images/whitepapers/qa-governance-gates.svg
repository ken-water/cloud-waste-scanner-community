<foreignObject x="124" y="292" width="200" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#334155;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">Security Audit</div></foreignObject>
