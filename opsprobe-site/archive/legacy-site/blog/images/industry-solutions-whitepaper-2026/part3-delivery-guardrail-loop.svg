<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="t d">
  <title id="t">Delivery guardrail loop</title>
  <desc id="d">PR checks, scheduled scans, and release closeout evidence connected in a continuous governance loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef3ff"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0a66c2"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1d4ed8"/></marker>
  </defs>
  <rect width="1700" height="980" fill="url(#bg)"/>
  <rect x="40" y="40" width="1620" height="900" rx="28" fill="#fff" stroke="#dbeafe" stroke-width="2"/>
  <rect x="70" y="64" width="1560" height="84" rx="18" fill="url(#head)"/>
  <text x="100" y="116" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" fill="#fff">Engineering Guardrail Loop: Build, Run, Close</text>

  <g filter="url(#shadow)">
    <rect x="150" y="240" width="420" height="230" rx="18" fill="#ecfeff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="640" y="240" width="420" height="230" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="1130" y="240" width="420" height="230" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="390" y="560" width="420" height="230" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <rect x="890" y="560" width="420" height="230" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  </g>

  <foreignObject x="180" y="266" width="360" height="190"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Segoe UI,Arial,sans-serif;"><div style="font-size:26px;font-weight:700;color:#0f172a;">PR-Time Checks</div><div style="font-size:19px;line-height:1.35;color:#334155;">Tag completeness, policy linting, and exception expiry checks before merge.</div></div></foreignObject>
  <foreignObject x="670" y="266" width="360" height="190"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Segoe UI,Arial,sans-serif;"><div style="font-size:26px;font-weight:700;color:#0f172a;">Scheduled Runtime Scans</div><div style="font-size:19px;line-height:1.35;color:#334155;">Provider-safe concurrency and deterministic failure classes across active accounts.</div></div></foreignObject>
  <foreignObject x="1160" y="266" width="360" height="190"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Segoe UI,Arial,sans-serif;"><div style="font-size:26px;font-weight:700;color:#0f172a;">Release Closeout</div><div style="font-size:19px;line-height:1.35;color:#334155;">Owner assignment, approval records, and evidence packaging for unresolved classes.</div></div></foreignObject>
  <foreignObject x="420" y="586" width="360" height="190"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Segoe UI,Arial,sans-serif;"><div style="font-size:26px;font-weight:700;color:#0f172a;">Weekly Triage Loop</div><div style="font-size:19px;line-height:1.35;color:#334155;">Sort by class and owner, route by risk lane, and cap exception age.</div></div></foreignObject>
  <foreignObject x="920" y="586" width="360" height="190"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Segoe UI,Arial,sans-serif;"><div style="font-size:26px;font-weight:700;color:#0f172a;">KPI Feedback</div><div style="font-size:19px;line-height:1.35;color:#334155;">Track recurrence, closure lead time, and realized-to-potential ratio for policy tuning.</div></div></foreignObject>

  <path d="M570,355 L640,355" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowHead)"/>
  <path d="M1060,355 L1130,355" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowHead)"/>
  <path d="M1340,470 L1120,560" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowHead)"/>
  <path d="M890,675 L810,675" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowHead)"/>
  <path d="M390,675 L260,470" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowHead)"/>
</svg>
