<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="t d">
  <title id="t">Ninety-day governance rollout roadmap</title>
  <desc id="d">Roadmap with baseline, execution and prevention phases plus KPI and executive-reporting checkpoints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef3ff"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0a66c2"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#1d4ed8"/></marker>
  </defs>
  <rect width="1700" height="980" fill="url(#bg)"/>
  <rect x="40" y="40" width="1620" height="900" rx="28" fill="#fff" stroke="#dbeafe" stroke-width="2"/>
  <rect x="70" y="64" width="1560" height="84" rx="18" fill="url(#head)"/>
  <text x="100" y="116" font-size="34" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" fill="#fff">90-Day Governance Rollout and KPI Checkpoints</text>

  <g filter="url(#shadow)">
    <rect x="130" y="250" width="420" height="500" rx="20" fill="#ecfeff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="640" y="250" width="420" height="500" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="1150" y="250" width="420" height="500" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  </g>

  <foreignObject x="160" y="280" width="360" height="440"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Segoe UI,Arial,sans-serif;color:#0f172a;"><div style="font-size:28px;font-weight:700;">Days 1-30</div><div style="font-size:22px;font-weight:700;margin:4px 0 10px;">Baseline</div><div style="font-size:19px;line-height:1.35;color:#334155;">• Taxonomy and owner matrix<br/>• Evidence packet template<br/>• First weekly triage cadence</div><div style="margin-top:12px;font-size:20px;font-weight:700;">Gate</div><div style="font-size:18px;line-height:1.35;color:#334155;">Finding classes stable and owner assignment above threshold.</div></div></foreignObject>
  <foreignObject x="670" y="280" width="360" height="440"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Segoe UI,Arial,sans-serif;color:#0f172a;"><div style="font-size:28px;font-weight:700;">Days 31-60</div><div style="font-size:22px;font-weight:700;margin:4px 0 10px;">Execution</div><div style="font-size:19px;line-height:1.35;color:#334155;">• Risk-tiered approvals<br/>• Recurrence tracking<br/>• Exception expiry controls</div><div style="margin-top:12px;font-size:20px;font-weight:700;">Gate</div><div style="font-size:18px;line-height:1.35;color:#334155;">Closure lead time and recurrence trend are both improving.</div></div></foreignObject>
  <foreignObject x="1180" y="280" width="360" height="440"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Segoe UI,Arial,sans-serif;color:#0f172a;"><div style="font-size:28px;font-weight:700;">Days 61-90</div><div style="font-size:22px;font-weight:700;margin:4px 0 10px;">Prevention</div><div style="font-size:19px;line-height:1.35;color:#334155;">• CI and schedule guardrails<br/>• Monthly executive one-page report<br/>• Quarterly policy tuning model</div><div style="margin-top:12px;font-size:20px;font-weight:700;">Gate</div><div style="font-size:18px;line-height:1.35;color:#334155;">High-confidence debt classes stay controlled without emergency cleanup.</div></div></foreignObject>

  <path d="M550,500 L640,500" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowHead)"/>
  <path d="M1060,500 L1150,500" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowHead)"/>

  <g filter="url(#shadow)"><rect x="130" y="790" width="1440" height="110" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/></g>
  <foreignObject x="160" y="815" width="1380" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;line-height:1.35;color:#334155;">Executive reporting baseline each month: resolved classes, unresolved backlog with owners, exception hygiene, and one policy adjustment proposal linked to KPI impact.</div></foreignObject>
</svg>
