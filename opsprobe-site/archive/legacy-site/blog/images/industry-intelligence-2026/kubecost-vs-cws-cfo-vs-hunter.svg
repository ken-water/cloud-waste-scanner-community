<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Kubecost vs CWS Operating Role Comparison</title>
  <desc id="desc">Kubecost as financial governance layer versus CWS as runtime waste elimination layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="860" fill="url(#bg)"/>

  <text x="700" y="80" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#0f172a">
    Kubecost vs CWS: Allocation Governance and Runtime Elimination
  </text>
  <text x="700" y="116" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#334155">
    One tool explains where Kubernetes money goes. The other removes what should no longer exist.
  </text>

  <g filter="url(#cardShadow)">
    <rect x="110" y="170" width="560" height="610" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="730" y="170" width="560" height="610" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>

  <rect x="110" y="170" width="560" height="72" rx="18" fill="#dbeafe"/>
  <text x="390" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#1d4ed8">
    Kubecost (Financial Governance)
  </text>

  <rect x="730" y="170" width="560" height="72" rx="18" fill="#dcfce7"/>
  <text x="1010" y="216" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#166534">
    CWS (Runtime Waste Elimination)
  </text>

  <g>
    <rect x="160" y="286" width="460" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="390" y="338" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">Namespace / Label Cost Allocation</text>

    <rect x="160" y="430" width="460" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="390" y="482" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">Prometheus Metrics and Unit Cost</text>

    <rect x="160" y="574" width="460" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="390" y="626" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">Finance Showback / Chargeback</text>

    <line x1="390" y1="386" x2="390" y2="430" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="390" y1="530" x2="390" y2="574" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="780" y="286" width="460" height="86" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1010" y="336" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#14532d">Live Resource Fingerprint Scan</text>

    <rect x="780" y="398" width="460" height="86" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1010" y="448" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#14532d">Orphan Volumes / Zombie Snapshots</text>

    <rect x="780" y="510" width="460" height="86" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1010" y="560" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#14532d">Image Residue / Idle Bandwidth</text>

    <rect x="780" y="622" width="460" height="86" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1010" y="672" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#14532d">Action Ledger with Evidence</text>

    <line x1="1010" y1="372" x2="1010" y2="398" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1010" y1="484" x2="1010" y2="510" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1010" y1="596" x2="1010" y2="622" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <line x1="620" y1="460" x2="780" y2="460" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="700" y="446" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#334155">Ownership to closure handoff</text>

  <text x="700" y="818" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#334155">
    Practical pattern: allocate to assign owners, then eliminate waste to realize savings in the same cycle.
  </text>
</svg>
