<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
  <title id="t">CWS and CloudCustodian Sequenced Workflow</title>
  <desc id="d">Three-step sequence from rapid scan to policy codification.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0f172a"/>
    </marker>
    <style>
      .title{font:700 42px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,sans-serif;fill:#0f172a}
      .sub{font:500 23px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,sans-serif;fill:#475569}
      .step{font:700 24px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,sans-serif;fill:#0f172a}
      .txt{font:500 20px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,sans-serif;fill:#1e293b}
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#g)"/>
  <text x="700" y="72" text-anchor="middle" class="title">Execution Sequence for Mixed Teams</text>
  <text x="700" y="110" text-anchor="middle" class="sub">Clean active waste first, then codify repeat problems into policy</text>

  <rect x="90" y="180" rx="24" ry="24" width="360" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="270" cy="238" r="30" fill="#dbeafe"/>
  <text x="270" y="246" text-anchor="middle" class="step">1</text>
  <text x="270" y="305" text-anchor="middle" class="step">CWS Rapid Scan</text>
  <text x="270" y="355" text-anchor="middle" class="txt">Find idle resources,</text>
  <text x="270" y="388" text-anchor="middle" class="txt">orphaned snapshots,</text>
  <text x="270" y="421" text-anchor="middle" class="txt">and low-ownership assets.</text>

  <rect x="520" y="180" rx="24" ry="24" width="360" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="700" cy="238" r="30" fill="#dcfce7"/>
  <text x="700" y="246" text-anchor="middle" class="step">2</text>
  <text x="700" y="305" text-anchor="middle" class="step">Evidence-Led Cleanup</text>
  <text x="700" y="355" text-anchor="middle" class="txt">Prioritize by cost impact,</text>
  <text x="700" y="388" text-anchor="middle" class="txt">execute safe removals,</text>
  <text x="700" y="421" text-anchor="middle" class="txt">and verify invoice delta.</text>

  <rect x="950" y="180" rx="24" ry="24" width="360" height="360" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="1130" cy="238" r="30" fill="#fee2e2"/>
  <text x="1130" y="246" text-anchor="middle" class="step">3</text>
  <text x="1130" y="305" text-anchor="middle" class="step">CloudCustodian Rules</text>
  <text x="1130" y="355" text-anchor="middle" class="txt">Convert recurring waste</text>
  <text x="1130" y="388" text-anchor="middle" class="txt">into policy guardrails</text>
  <text x="1130" y="421" text-anchor="middle" class="txt">for long-term control.</text>

  <path d="M450 360 L520 360" stroke="#0f172a" stroke-width="3" marker-end="url(#a)"/>
  <path d="M880 360 L950 360" stroke="#0f172a" stroke-width="3" marker-end="url(#a)"/>

  <rect x="220" y="592" rx="16" ry="16" width="960" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="700" y="646" text-anchor="middle" class="txt">This sequence minimizes immediate cloud spend while building durable governance over time.</text>
</svg>
