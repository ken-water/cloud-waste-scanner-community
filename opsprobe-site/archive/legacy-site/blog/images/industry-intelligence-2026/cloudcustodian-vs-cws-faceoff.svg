<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="t d">
  <title id="t">CloudCustodian vs Cloud Waste Scanner Operating Model</title>
  <desc id="d">Left side shows policy as code lifecycle. Right side shows rapid scan and cleanup loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 44px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,sans-serif;fill:#0f172a}
      .subtitle{font:500 24px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,sans-serif;fill:#475569}
      .h{font:700 28px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,sans-serif;fill:#0f172a}
      .b{font:500 21px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,sans-serif;fill:#1e293b}
      .cap{font:600 20px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,sans-serif;fill:#334155}
    </style>
  </defs>

  <rect width="1400" height="880" fill="url(#bg)"/>
  <text x="700" y="72" text-anchor="middle" class="title">Rule Engine vs Scan Radar</text>
  <text x="700" y="112" text-anchor="middle" class="subtitle">CloudCustodian and CWS solve different moments in the same cost lifecycle</text>

  <rect x="80" y="160" rx="24" ry="24" width="580" height="620" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="740" y="160" rx="24" ry="24" width="580" height="620" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="370" y="218" text-anchor="middle" class="h">CloudCustodian (Policy Firepower)</text>
  <text x="1030" y="218" text-anchor="middle" class="h">CWS (Precision Scan Radar)</text>

  <rect x="130" y="270" rx="14" ry="14" width="480" height="94" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="370" y="325" text-anchor="middle" class="b">Write YAML policies</text>

  <rect x="130" y="408" rx="14" ry="14" width="480" height="94" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="370" y="463" text-anchor="middle" class="b">Schedule and enforce rules</text>

  <rect x="130" y="546" rx="14" ry="14" width="480" height="94" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="370" y="601" text-anchor="middle" class="b">Review drift and tune policy</text>

  <path d="M370 364 L370 408" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M370 502 L370 546" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M240 640 C200 700, 540 700, 500 640" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="790" y="270" rx="14" ry="14" width="480" height="94" fill="#dcfce7" stroke="#86efac"/>
  <text x="1030" y="325" text-anchor="middle" class="b">Run local-first cloud scan</text>

  <rect x="790" y="408" rx="14" ry="14" width="480" height="94" fill="#dcfce7" stroke="#86efac"/>
  <text x="1030" y="463" text-anchor="middle" class="b">Prioritize waste by impact</text>

  <rect x="790" y="546" rx="14" ry="14" width="480" height="94" fill="#dcfce7" stroke="#86efac"/>
  <text x="1030" y="601" text-anchor="middle" class="b">Apply cleanup and verify savings</text>

  <path d="M1030 364 L1030 408" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1030 502 L1030 546" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M900 640 C860 700, 1200 700, 1160 640" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="700" y="816" text-anchor="middle" class="cap">Best practice: use CWS for immediate waste recovery, then encode repeat patterns in CloudCustodian policies.</text>
</svg>
