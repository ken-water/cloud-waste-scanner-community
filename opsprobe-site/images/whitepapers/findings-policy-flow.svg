<foreignObject x="454" y="292" width="280" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#0c1724;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">resource_type, owner, cost, and usage<br/>context</div></foreignObject>
<g filter="url(#softShadow)"><rect x="810" y="220" width="270" height="150" rx="16" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/></g>
<rect x="810" y="220" width="8" height="150" rx="8" fill="#14b8a6"/>
<foreignObject x="834" y="238" width="230" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#0c1724;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">Heuristics</div></foreignObject>
<foreignObject x="834" y="292" width="230" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#0c1724;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">waste signal scoring and<br/>threshold gates</div></foreignObject>
<g filter="url(#softShadow)"><rect x="1140" y="220" width="240" height="150" rx="16" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/></g>
<rect x="1140" y="220" width="8" height="150" rx="8" fill="#0c1724"/>
<foreignObject x="1164" y="238" width="200" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#0c1724;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">Policy</div></foreignObject>
<foreignObject x="1164" y="292" width="200" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#0c1724;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">priority + severity<br/>mapping</div></foreignObject>
