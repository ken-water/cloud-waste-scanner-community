<rect x="1440" y="220" width="8" height="150" rx="8" fill="#60a5fa"/>
<foreignObject x="1464" y="238" width="220" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#d8e1ee;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">Outputs</div></foreignObject>
<foreignObject x="1464" y="292" width="220" height="66"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#d8e1ee;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">PDF / CSV / API review<br/>artifacts</div></foreignObject>
<g filter="url(#softShadow)"><rect x="100" y="440" width="780" height="430" rx="16" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/></g>
<rect x="100" y="440" width="8" height="430" rx="8" fill="#0c1724"/>
<foreignObject x="124" y="458" width="740" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#0c1724;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">Example Waste Heuristics (Default Baseline)</div></foreignObject>
<foreignObject x="124" y="512" width="740" height="346"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#0c1724;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">• Idle LB: no request activity and no active backend attachment.<br/>• Orphan volume: unattached block storage beyond grace period.<br/>• Aged snapshot: retained past review policy threshold.<br/>• Public IP drift: reserved/static IP without mapped workload.<br/>Signals are recommendations for review, not automatic destructive actions.</div></foreignObject>
<g filter="url(#softShadow)"><rect x="920" y="440" width="780" height="430" rx="16" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/></g>
<rect x="920" y="440" width="8" height="430" rx="8" fill="#1f6feb"/>
<foreignObject x="944" y="458" width="740" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:23px;font-weight:700;line-height:1.2;color:#0c1724;display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden;">Known Limits and Tradeoffs</div></foreignObject>
<foreignObject x="944" y="512" width="740" height="346"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#0c1724;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">• Some utilization dimensions depend on provider telemetry scope.<br/>• Permission boundaries can reduce attribute visibility.<br/>• Rate-limit protection favors stable completion over burst speed.<br/>• Multi-account consistency depends on normalized owner/tag hygiene.<br/>Guidance: run read-only first, then tune thresholds with owners.</div></foreignObject>
