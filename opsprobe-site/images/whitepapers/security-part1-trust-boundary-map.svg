<foreignObject x="714" y="262" width="280" height="86"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.35;color:#0c1724;display:block;word-break:break-word;overflow-wrap:anywhere;overflow:hidden;">Scan orchestration,<br/>normalization, and policy<br/>evaluation execute locally.</div></foreignObject>
