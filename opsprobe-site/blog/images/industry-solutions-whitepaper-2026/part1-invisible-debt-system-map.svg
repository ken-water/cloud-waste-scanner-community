<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="t d">
  <title id="t">Invisible cloud debt system map</title>
  <desc id="d">Diagram showing how findings stall when discovery, ownership, evidence and closure are disconnected, and how an execution contract reconnects them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#eef8f6"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0a83b"/>
      <stop offset="100%" stop-color="#49c6b7"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0c1724" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0c1724"/>
    </marker>
  </defs>

  <rect width="1700" height="980" fill="url(#bg)"/>
  <rect x="40" y="40" width="1620" height="900" rx="28" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/>
  <rect x="70" y="64" width="1560" height="84" rx="18" fill="url(#header)"/>
  <text x="100" y="116" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff">Invisible Cloud Debt: Why Findings Stall Before Financial Impact Is Closed</text>

  <g filter="url(#cardShadow)">
    <rect x="110" y="190" width="1480" height="220" rx="20" fill="#fffaf0" stroke="#d8e1ee" stroke-width="2"/>
  </g>
  <text x="145" y="240" font-size="29" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" fill="#0c1724">Observed anti-pattern in weekly operations</text>
  <foreignObject x="145" y="265" width="1410" height="120">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:22px;font-weight:500;line-height:1.35;color:#0c1724;">
      Teams can detect waste, but closure breaks across handoff boundaries: finance sees category variance, platform sees resource state,
      and service teams see release pressure. The result is recurring spend that is acknowledged but not resolved.
    </div>
  </foreignObject>

  <g filter="url(#cardShadow)">
    <rect x="130" y="460" width="320" height="230" rx="18" fill="#eef8f6" stroke="#99f6e4" stroke-width="2"/>
    <rect x="490" y="460" width="320" height="230" rx="18" fill="#fdf7ea" stroke="#d8e1ee" stroke-width="2"/>
    <rect x="850" y="460" width="320" height="230" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="1210" y="460" width="320" height="230" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  </g>

  <foreignObject x="158" y="488" width="264" height="174">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;color:#0c1724;">
      <div style="font-size:24px;font-weight:700;margin-bottom:8px;">Discovery</div>
      <div style="font-size:20px;line-height:1.35;color:#0c1724;">Idle artifacts are identified by scanners, but findings are still unassigned.</div>
    </div>
  </foreignObject>
  <foreignObject x="518" y="488" width="264" height="174">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;color:#0c1724;">
      <div style="font-size:24px;font-weight:700;margin-bottom:8px;">Ownership</div>
      <div style="font-size:20px;line-height:1.35;color:#0c1724;">No named resolver means findings survive one or more sprint cycles.</div>
    </div>
  </foreignObject>
  <foreignObject x="878" y="488" width="264" height="174">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;color:#0c1724;">
      <div style="font-size:24px;font-weight:700;margin-bottom:8px;">Evidence</div>
      <div style="font-size:20px;line-height:1.35;color:#0c1724;">Decisions are disputed if source references are missing or inconsistent.</div>
    </div>
  </foreignObject>
  <foreignObject x="1238" y="488" width="264" height="174">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;color:#0c1724;">
      <div style="font-size:24px;font-weight:700;margin-bottom:8px;">Closure</div>
      <div style="font-size:20px;line-height:1.35;color:#0c1724;">Spend reduction is delayed until action owner and due date are enforced.</div>
    </div>
  </foreignObject>

  <path d="M450,575 L490,575" fill="none" stroke="#1f6feb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowHead)"/>
  <path d="M810,575 L850,575" fill="none" stroke="#1f6feb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowHead)"/>
  <path d="M1170,575 L1210,575" fill="none" stroke="#1f6feb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowHead)"/>

  <g filter="url(#cardShadow)">
    <rect x="130" y="740" width="1400" height="150" rx="18" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/>
  </g>
  <text x="165" y="792" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" fill="#0c1724">Execution contract that closes the loop</text>
  <foreignObject x="165" y="808" width="1335" height="72">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter, Segoe UI, Arial, sans-serif;font-size:20px;font-weight:500;line-height:1.3;color:#0c1724;">
      Attach owner, due date, and source evidence at finding creation time. Teams using this contract converge faster because finance, engineering,
      and management review the same object with the same decision context.
    </div>
  </foreignObject>
</svg>
