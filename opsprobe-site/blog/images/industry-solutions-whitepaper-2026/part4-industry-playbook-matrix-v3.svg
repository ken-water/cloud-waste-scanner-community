<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1020" viewBox="0 0 1700 1020" role="img" aria-labelledby="t d">
  <title id="t">Industry playbook matrix</title>
  <desc id="d">Comparison matrix for finance-led, product-led SaaS, and platform-centric governance operating models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#eef8f6"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0a83b"/>
      <stop offset="100%" stop-color="#49c6b7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0c1724" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1700" height="1020" fill="url(#bg)"/>
  <rect x="40" y="40" width="1620" height="940" rx="26" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/>
  <rect x="70" y="66" width="1560" height="86" rx="16" fill="url(#head)"/>
  <text x="102" y="120" font-size="38" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff">Industry Governance Playbook Matrix</text>

  <g filter="url(#shadow)">
    <rect x="100" y="190" width="1500" height="740" rx="18" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/>
    <rect x="100" y="190" width="1500" height="110" rx="18" fill="#fffaf0"/>
  </g>

  <line x1="430" y1="190" x2="430" y2="930" stroke="#e1e9f3" stroke-width="2"/>
  <line x1="830" y1="190" x2="830" y2="930" stroke="#e1e9f3" stroke-width="2"/>
  <line x1="1220" y1="190" x2="1220" y2="930" stroke="#e1e9f3" stroke-width="2"/>

  <line x1="100" y1="300" x2="1600" y2="300" stroke="#e1e9f3" stroke-width="2"/>
  <line x1="100" y1="510" x2="1600" y2="510" stroke="#e1e9f3" stroke-width="2"/>
  <line x1="100" y1="720" x2="1600" y2="720" stroke="#e1e9f3" stroke-width="2"/>

  <text x="130" y="258" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0c1724">Operating Model</text>
  <text x="460" y="258" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0c1724">Primary Failure Pattern</text>
  <text x="860" y="258" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0c1724">Recommended Cadence</text>
  <text x="1250" y="258" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0c1724">Control Focus</text>

  <foreignObject x="112" y="312" width="306" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;"><div style="font-weight:700;color:#0c1724;font-size:22px;margin-bottom:10px;">Finance-led</div>Central target setting with distributed execution.</div></foreignObject>
  <foreignObject x="442" y="312" width="376" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Analysis depth is high, but closure ownership arrives late and backlog aging increases.</div></foreignObject>
  <foreignObject x="842" y="312" width="366" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Weekly triage plus monthly executive realized-impact review.</div></foreignObject>
  <foreignObject x="1232" y="312" width="356" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Evidence consistency and closure accountability.</div></foreignObject>

  <foreignObject x="112" y="522" width="306" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;"><div style="font-weight:700;color:#0c1724;font-size:22px;margin-bottom:10px;">Product-led SaaS</div>High release velocity with distributed ownership.</div></foreignObject>
  <foreignObject x="442" y="522" width="376" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">The same debt class reappears after each release wave.</div></foreignObject>
  <foreignObject x="842" y="522" width="366" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">PR checks plus post-release scoped scan and sprint closeout validation.</div></foreignObject>
  <foreignObject x="1232" y="522" width="356" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Recurrence prevention and exception expiry discipline.</div></foreignObject>

  <foreignObject x="112" y="732" width="306" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;"><div style="font-weight:700;color:#0c1724;font-size:22px;margin-bottom:10px;">Platform-centric</div>Shared infrastructure serving multiple teams.</div></foreignObject>
  <foreignObject x="442" y="732" width="376" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Ticket ping-pong due to account-level routing ambiguity.</div></foreignObject>
  <foreignObject x="842" y="732" width="366" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Weekly routing board plus quarterly policy recalibration.</div></foreignObject>
  <foreignObject x="1232" y="732" width="356" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Routing precision and reassignment reduction.</div></foreignObject>
</svg>
