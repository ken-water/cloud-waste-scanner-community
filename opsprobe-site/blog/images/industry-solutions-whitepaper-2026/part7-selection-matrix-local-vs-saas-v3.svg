<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1020" viewBox="0 0 1700 1020" role="img" aria-labelledby="t d">
  <title id="t">Selection matrix local-first vs SaaS vs hybrid</title>
  <desc id="d">Decision matrix comparing local-first, SaaS, and hybrid choices by custody boundary, execution speed, and reporting depth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#eef8f6"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0a83b"/>
      <stop offset="100%" stop-color="#49c6b7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0c1724" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1700" height="1020" fill="url(#bg)"/>
  <rect x="40" y="40" width="1620" height="940" rx="26" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/>
  <rect x="70" y="66" width="1560" height="86" rx="16" fill="url(#head)"/>
  <text x="102" y="120" font-size="38" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff">Selection Matrix: Local-First vs SaaS vs Hybrid</text>

  <g filter="url(#shadow)">
    <rect x="100" y="190" width="1500" height="740" rx="18" fill="#ffffff" stroke="#d8e1ee" stroke-width="2"/>
    <rect x="100" y="190" width="1500" height="110" rx="18" fill="#fffaf0"/>
  </g>

  <line x1="420" y1="190" x2="420" y2="930" stroke="#e1e9f3" stroke-width="2"/>
  <line x1="810" y1="190" x2="810" y2="930" stroke="#e1e9f3" stroke-width="2"/>
  <line x1="1210" y1="190" x2="1210" y2="930" stroke="#e1e9f3" stroke-width="2"/>

  <line x1="100" y1="300" x2="1600" y2="300" stroke="#e1e9f3" stroke-width="2"/>
  <line x1="100" y1="510" x2="1600" y2="510" stroke="#e1e9f3" stroke-width="2"/>
  <line x1="100" y1="720" x2="1600" y2="720" stroke="#e1e9f3" stroke-width="2"/>

  <text x="130" y="258" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0c1724">Criteria</text>
  <text x="450" y="258" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0c1724">Local-First</text>
  <text x="840" y="258" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0c1724">SaaS Platform</text>
  <text x="1240" y="258" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0c1724">Hybrid</text>

  <foreignObject x="112" y="312" width="296" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;"><div style="font-weight:700;color:#0c1724;font-size:22px;margin-bottom:10px;">Custody boundary</div>Where metadata and credentials are processed.</div></foreignObject>
  <foreignObject x="432" y="312" width="366" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Strong fit for boundary-sensitive teams with operator-controlled custody.</div></foreignObject>
  <foreignObject x="822" y="312" width="376" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Requires vendor custody acceptance and formal security review.</div></foreignObject>
  <foreignObject x="1222" y="312" width="366" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Strategic split: SaaS for attribution, local for sensitive execution lanes.</div></foreignObject>

  <foreignObject x="112" y="522" width="296" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;"><div style="font-weight:700;color:#0c1724;font-size:22px;margin-bottom:10px;">Execution latency</div>Speed from finding to approved closure action.</div></foreignObject>
  <foreignObject x="432" y="522" width="366" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Fast for weekly owner-based closure workflows.</div></foreignObject>
  <foreignObject x="822" y="522" width="376" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Strong for strategic analysis; action latency depends on process chain.</div></foreignObject>
  <foreignObject x="1222" y="522" width="366" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Can optimize both with shared KPI semantic contracts.</div></foreignObject>

  <foreignObject x="112" y="732" width="296" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;"><div style="font-weight:700;color:#0c1724;font-size:22px;margin-bottom:10px;">Reporting depth</div>Executive analytics vs action-grade evidence.</div></foreignObject>
  <foreignObject x="432" y="732" width="366" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">High action-grade evidence and technical traceability.</div></foreignObject>
  <foreignObject x="822" y="732" width="376" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">High macro attribution and executive narrative strength.</div></foreignObject>
  <foreignObject x="1222" y="732" width="366" height="186"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 19px/1.55 'Segoe UI', Arial, sans-serif; color:#0c1724;">Best when teams maintain one metric dictionary across layers.</div></foreignObject>
</svg>
